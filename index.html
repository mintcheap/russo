<style>
/* Layout: one-screen phone app. Blue-on-white ceramic (Gzhel porcelain meets Portuguese azulejo): porcelain ground, cobalt ink, tile motifs on deck tiles. */
:root {
  --bg: #F2F4FA;
  --surface: #FFFFFF;
  --ink: #131D47;
  --muted: #5A6488;
  --cobalt: #2341A8;
  --cobalt-ink: #FFFFFF;
  --cobalt-soft: #DFE5F8;
  --line: #CBD3ED;
  --good: #1E7A4F;
  --good-soft: #DDF2E6;
  --hard: #9A5F06;
  --hard-soft: #F8ECD6;
  --miss: #B3261E;
  --miss-soft: #F9E0DE;
  --shadow: 0 1px 2px rgba(19,29,71,.06), 0 8px 24px rgba(19,29,71,.08);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1130; --surface: #131C44; --ink: #E7EBFA; --muted: #9AA4CC;
  --cobalt: #93A9FF; --cobalt-ink: #0A1130; --cobalt-soft: #1E2A63; --line: #2A3672;
  --good: #6BD39E; --good-soft: #143A2C; --hard: #E8B556; --hard-soft: #3A2E12;
  --miss: #FF8A80; --miss-soft: #401C22; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A1130; --surface: #131C44; --ink: #E7EBFA; --muted: #9AA4CC;
  --cobalt: #93A9FF; --cobalt-ink: #0A1130; --cobalt-soft: #1E2A63; --line: #2A3672;
  --good: #6BD39E; --good-soft: #143A2C; --hard: #E8B556; --hard-soft: #3A2E12;
  --miss: #FF8A80; --miss-soft: #401C22; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 8px; min-height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid transparent;
}
.bar.scrolled { border-bottom-color: var(--line); }
.bar h1 { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: .01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar h1 .ru { color: var(--cobalt); }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn:active { background: var(--cobalt-soft); }
.iconbtn svg { width: 24px; height: 24px; }

main {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 32px;
}
.view { display: flex; flex-direction: column; gap: 16px; }

/* Today panel */
.today { background: var(--cobalt); color: var(--cobalt-ink); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.today::after { content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; opacity: .16;
  background: radial-gradient(circle at 50% 50%, transparent 30%, currentColor 31% 34%, transparent 35% 46%, currentColor 47% 50%, transparent 51%); pointer-events: none; }
.today .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; opacity: .85; font-weight: 600; }
.today .big { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.today .sub { opacity: .9; font-size: 15px; }
.btn { border: 0; border-radius: 14px; min-height: 50px; padding: 0 18px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--cobalt); color: var(--cobalt-ink); }
.btn.light { background: var(--cobalt-ink); color: var(--cobalt); }
.btn.ghost { background: var(--cobalt-soft); color: var(--cobalt); }
.btn.outline { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn:active { transform: scale(.98); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn[disabled] { opacity: .45; }

.section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 8px 2px -4px; }

/* Deck tiles */
.decks { display: grid; grid-template-columns: 1fr; gap: 12px; }
.deck { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; width: 100%; }
.deck:active { border-color: var(--cobalt); }
.tile {
  width: 76px; height: 76px; border-radius: 12px; display: grid; place-items: center; position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 0 0, var(--cobalt-soft) 0 14px, transparent 15px),
    radial-gradient(circle at 100% 0, var(--cobalt-soft) 0 14px, transparent 15px),
    radial-gradient(circle at 0 100%, var(--cobalt-soft) 0 14px, transparent 15px),
    radial-gradient(circle at 100% 100%, var(--cobalt-soft) 0 14px, transparent 15px),
    var(--surface);
  border: 2px solid var(--cobalt); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px var(--cobalt);
}
.tile span { font-family: var(--f-display); font-weight: 700; color: var(--cobalt); font-size: 17px; letter-spacing: -.01em; }
.tile span.s5 { font-size: 14px; }
.tile span.s6 { font-size: 12px; }
.tile span.s2 { font-size: 26px; }
.deck h3 { margin: 0; font-size: 17px; font-weight: 700; }
.deck p { margin: 2px 0 8px; color: var(--muted); font-size: 14px; line-height: 1.35; }
.meter { height: 6px; border-radius: 3px; background: var(--cobalt-soft); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .m1 { background: var(--cobalt); }
.meter .m2 { background: color-mix(in srgb, var(--cobalt) 45%, transparent); }
.deck .stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; gap: 8px; }
.due-pill { font-size: 12px; font-weight: 600; color: var(--cobalt); background: var(--cobalt-soft); border-radius: 999px; padding: 1px 8px; }

/* Deck screen */
.deck-hero { display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: center; }
.deck-hero .tile { width: 88px; height: 88px; }
.deck-hero h2 { font-family: var(--f-display); font-size: 22px; margin: 0 0 4px; line-height: 1.15; text-wrap: balance; }
.deck-hero p { margin: 0; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .btn { flex-direction: column; min-height: 76px; gap: 2px; padding: 10px; text-align: center; }
.actions .btn small { font-weight: 400; font-size: 12px; opacity: .8; }
.actions .wide { grid-column: 1 / -1; }
.wordlist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.word { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 10px 6px 10px 14px; border-top: 1px solid var(--line); }
.word:first-child { border-top: 0; }
.word .ru { font-weight: 600; font-size: 17px; }
.word .tr { color: var(--muted); font-size: 13px; }
.word .pt { font-size: 14px; }
.word .w { min-width: 0; }
.lvl { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--line); }
.lvl.l1 { background: color-mix(in srgb, var(--cobalt) 45%, transparent); }
.lvl.l2 { background: var(--cobalt); }

/* Flashcard */
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress .meter { flex: 1; }
.scene { perspective: 1200px; }
.card { position: relative; width: 100%; min-height: 340px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1); cursor: pointer; }
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border-radius: 22px; box-shadow: var(--shadow);
  border: 2px solid var(--cobalt); outline: 1px solid var(--cobalt); outline-offset: -8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px 22px; gap: 10px;
}
.face.back { transform: rotateY(180deg); }
.face .tag { position: absolute; top: 16px; left: 18px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.face .ruw { font-size: clamp(30px, 9vw, 44px); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.face .ruw.letter { font-family: var(--f-display); font-size: 72px; color: var(--cobalt); }
.face .ptw { font-size: clamp(24px, 7vw, 32px); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.face .tr { color: var(--muted); font-size: 18px; }
.face .tr b, .word .tr b { color: var(--cobalt); font-weight: 700; }
.face .ex { color: var(--muted); font-size: 15px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 6px; max-width: 32ch; }
.face .hint { position: absolute; bottom: 14px; font-size: 13px; color: var(--muted); }
.say { position: absolute; top: 8px; right: 8px; }
.say.slow { right: 54px; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grades .btn { flex-direction: column; min-height: 62px; gap: 0; font-size: 15px; }
.grades .btn small { font-weight: 400; font-size: 11px; opacity: .8; }
.g0 { background: var(--miss-soft); color: var(--miss); }
.g1 { background: var(--hard-soft); color: var(--hard); }
.g2 { background: var(--good-soft); color: var(--good); }

/* Quiz */
.prompt { background: var(--surface); border: 2px solid var(--cobalt); border-radius: 22px; padding: 28px 18px 22px; text-align: center; position: relative; display: grid; gap: 6px; }
.prompt .q { font-size: clamp(26px, 8vw, 38px); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.prompt .q.letter { font-family: var(--f-display); font-size: 60px; color: var(--cobalt); }
.prompt .tr { color: var(--muted); }
.prompt .tr b { color: var(--cobalt); }
.prompt .ask { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.options { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 17px; min-height: 54px; font-weight: 500; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt.wrong { border-color: var(--miss); background: var(--miss-soft); color: var(--miss); }
.typein { display: grid; gap: 10px; }
.typein input { width: 100%; font: inherit; font-size: 20px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.feedback { border-radius: 14px; padding: 12px 14px; font-weight: 500; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--miss-soft); color: var(--miss); }

/* Results & misc */
.result { text-align: center; display: grid; gap: 14px; padding: 18px 0; }
.result h2 { font-family: var(--f-display); font-size: 26px; margin: 0; }
.result .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.result .nums div { border-radius: 14px; padding: 12px 6px; font-size: 13px; }
.result .nums b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; display: grid; gap: 14px; }
.empty h2 { color: var(--ink); font-family: var(--f-display); font-size: 22px; margin: 0; }

.settings { display: grid; gap: 12px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.row .lbl { font-weight: 600; }
.row .desc { color: var(--muted); font-size: 14px; margin-top: -6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--cobalt-soft); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 10px; min-height: 40px; font-weight: 600; color: var(--cobalt); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.switch input { width: 51px; height: 31px; appearance: none; -webkit-appearance: none; background: var(--line); border-radius: 999px; position: relative; flex: none; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked { background: var(--good); }
.switch input:checked::after { transform: translateX(20px); }
.note { font-size: 13px; color: var(--muted); }
.danger { color: var(--miss); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) { .card { transition: none; } .btn:active { transform: none; } }
</style>

// ---------- Text helpers ----------
const ACUTE = "́";
const VOW = "аеёиоуыэюя";
const acc = s => s.replace(/'/g, ACUTE);
const strip = s => s.replace(/['́]/g, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TR = { а:"a", б:"b", в:"v", г:"g", д:"d", ж:"j", з:"z", и:"i", й:"i", к:"k", л:"l", м:"m", н:"n", п:"p", р:"r", с:"s", т:"t", у:"u", ф:"f", х:"kh", ц:"ts", ч:"tch", ш:"ch", щ:"chtch", ъ:"", ы:"y", э:"e", ю:"iu", я:"ia" };

// Portuguese-friendly transliteration: "ch" = ш (as in chave), "j" = ж (as in já), unstressed о → "a".
function translitWord(tok) {
  const ch = [];
  for (const c of tok) { if (c === "'") { if (ch.length) ch[ch.length - 1].st = true; } else ch.push({ c, st: false }); }
  const lo = ch.map(x => x.c.toLowerCase());
  const nV = lo.filter(c => VOW.includes(c)).length;
  const hasSt = ch.some((x, i) => x.st || lo[i] === "ё") || nV === 1;
  const letters = lo.filter(c => /[а-яё]/.test(c)).join("");
  const ogo = /(ого|его)$/.test(letters) && letters.length > 3 && !/много$/.test(letters);
  let out = "";
  ch.forEach((x, i) => {
    const c = lo[i], prev = lo[i - 1] || "", next = lo[i + 1] || "";
    const isV = VOW.includes(c);
    const stressed = isV && (x.st || c === "ё");
    let m;
    if (!/[а-яё]/.test(c)) m = x.c;
    else if (c === "е") m = (!prev || VOW.includes(prev) || "ъь".includes(prev) || !/[а-яё]/.test(prev)) ? "ie" : "e";
    else if (c === "ё") m = (!prev || VOW.includes(prev) || "ъь".includes(prev) || !/[а-яё]/.test(prev)) ? "io" : "io";
    else if (c === "о") m = (hasSt && !stressed && nV > 1) ? "a" : "o";
    else if (c === "ь") m = VOW.includes(next) ? "" : "'";
    else if (c === "с") m = (VOW.includes(prev) && VOW.includes(next)) ? "ss" : "s";
    else if (c === "г") m = (ogo && lo.slice(i + 1).join("").replace(/[^а-яё]/g, "") === "о") ? "v" : ("еиёяю".includes(next) ? "gu" : "g");
    else m = TR[c] ?? c;
    if (x.c !== c && m) m = m[0].toUpperCase() + m.slice(1);
    out += (stressed && nV > 1) ? `<b>${esc(m)}</b>` : esc(m);
  });
  return out;
}
const translit = ru => ru.split(" ").map(translitWord).join(" ");
// FNV-1a hash of the spoken text → audio file name (build-audio.js uses this same function).
function audioKey(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, "0"); }
const trOverride =s => esc(s).replace(/[AEIOUY]/g, v => `<b>${v.toLowerCase()}</b>`);

// ---------- Build cards ----------
const CARDS = {};
DECKS.forEach(d => {
  d.cards = d.data.trim().split("\n").map(line => {
    const [ru, pt, ex = "", tr = ""] = line.split("|").map(s => s.trim());
    const id = d.id + ":" + strip(ru);
    const card = { id, deck: d.id, ru, pt, ex, alpha: !!d.alpha };
    card.ruHtml = esc(acc(ru));
    card.trHtml = d.alpha ? esc(tr) : (tr ? trOverride(tr) : translit(ru));
    const exWord = strip(ex.split(" — ")[0]);
    card.say = d.alpha ? ("ЪЬ".includes(ru[0]) ? exWord : ru[0] + ". " + exWord) : strip(ru).replace(/\.\.\./g, "");
    CARDS[id] = card;
    return card;
  });
});

// ---------- State & persistence ----------
const dayNum = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
const KEY = "azbuka-progress-v1";
const defaults = () => ({ v: 1, cards: {}, day: { d: dayNum(), n: 0 }, settings: { dir: "ru", tr: true, auto: false, newPer: 10 }, updated: 0 });
let S = defaults();
function mergeIn(obj) {
  if (!obj || typeof obj !== "object") return;
  const d = defaults();
  S = { ...d, ...obj, settings: { ...d.settings, ...(obj.settings || {}) }, day: { ...d.day, ...(obj.day || {}) }, cards: { ...(obj.cards || {}) } };
}
try { mergeIn(JSON.parse(localStorage.getItem(KEY))); } catch (e) {}

let db = null, progressRef = null, syncState = "local", saveTimer = null, writing = false, dirty = false;
function save() {
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!progressRef) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1500);
}
async function flush() {
  if (!progressRef || writing || !dirty) return;
  writing = true; dirty = false;
  try { await progressRef.set(JSON.parse(JSON.stringify(S))); syncState = "cloud"; }
  catch (e) { if (e && e.code === "invalid_argument") { progressRef = null; syncState = "local"; } else dirty = true; }
  writing = false;
  if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 3000); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [dbNs, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!dbNs || !user) return;
    const uid = await user.id();
    if (!uid) return;
    db = dbNs;
    progressRef = db.doc("data/users/" + uid + "/progress");
    const snap = await progressRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.updated || 0) > (S.updated || 0)) {
        mergeIn(remote);
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        if (view.name === "home" || view.name === "deck" || view.name === "settings") render();
      } else if ((S.updated || 0) > (remote.updated || 0)) { dirty = true; flush(); }
    } else if (S.updated) { dirty = true; flush(); }
    syncState = "cloud";
    if (view.name === "settings") render();
  } catch (e) { progressRef = null; syncState = "local"; }
}

// ---------- Spaced repetition (simplified SM-2) ----------
function rollDay() { const t = dayNum(); if (S.day.d !== t) S.day = { d: t, n: 0 }; }
const st = id => S.cards[id];
function grade(id, g) {
  rollDay();
  const t = dayNum();
  let c = S.cards[id];
  if (!c) { c = { r: 0, iv: 0, ef: 2.5, due: t, l: 0 }; S.day.n++; }
  if (g === 0) { c.r = 0; c.iv = 0; c.l++; c.ef = Math.max(1.3, c.ef - 0.2); c.due = t; }
  else if (g === 1) { c.iv = Math.max(1, Math.round(c.iv * 1.2)); c.ef = Math.max(1.3, c.ef - 0.15); c.r++; c.due = t + c.iv; }
  else { c.iv = c.r === 0 ? 1 : c.r === 1 ? 3 : Math.round(c.iv * c.ef); c.ef = Math.min(3, c.ef + 0.05); c.r++; c.due = t + c.iv; }
  S.cards[id] = c;
  save();
}
function deckStats(d) {
  const t = dayNum(); let seen = 0, known = 0, due = 0;
  d.cards.forEach(c => { const s = st(c.id); if (s) { seen++; if (s.iv >= 7) known++; if (s.due <= t) due++; } });
  return { seen, known, due, total: d.cards.length };
}
function newLeft() { rollDay(); return Math.max(0, S.settings.newPer - S.day.n); }
function buildReview(decks) {
  const t = dayNum();
  const all = decks.flatMap(d => d.cards);
  const due = all.filter(c => st(c.id) && st(c.id).due <= t).sort((a, b) => st(a.id).due - st(b.id).due);
  const fresh = all.filter(c => !st(c.id)).slice(0, newLeft());
  return [...due.slice(0, 30), ...fresh];
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let ruVoice = null, voicesChecked = false;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  if (vs.length) voicesChecked = true;
  ruVoice = vs.find(v => /^ru(-|_|$)/i.test(v.lang) && /milena/i.test(v.name)) || vs.find(v => /^ru(-|_|$)/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// Recorded audio first (audio/<hash>.mp3 published with the page); the device's voice is the fallback.
let player = null;
function speak(text, slow) {
  try {
    if (!player) { player = new Audio(); player.preload = "auto"; }
    player.pause();
    player.src = "audio/" + audioKey(text) + ".mp3";
    player.playbackRate = slow ? 0.65 : 1;
    try { player.preservesPitch = true; player.webkitPreservesPitch = true; } catch (e) {}
    const p = player.play();
    if (p && p.catch) p.catch(err => { if (!err || err.name !== "AbortError") deviceSpeak(text, slow); });
  } catch (e) { deviceSpeak(text, slow); }
}
function deviceSpeak(text, slow) {
  if (!("speechSynthesis" in window)) { toast("Não foi possível reproduzir o som."); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ru-RU"; if (ruVoice) u.voice = ruVoice;
    u.rate = slow ? 0.55 : 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}

}
function facePt(c, tag) {
  return `<div class="tag">${tag}</div><div class="ptw">${esc(c.pt)}</div>${c.ex ? `<div class="ex">${c.alpha ? esc(acc(c.ex)) : esc(c.ex)}</div>` : ""}`;
}
function renderStudy() {
  const v = view;
  setHeader(esc(v.title), true);
  const item = v.queue[v.i]; const c = CARDS[item.id];
  const front = item.dir === "ru" ? faceRu(c, "Russo") : facePt(c, "Português");
  const backF = item.dir === "ru" ? facePt(c, "Português") : faceRu(c, "Russo");
  const done = Object.keys(v.graded).length;
  $app.innerHTML = `<div class="view">
    <div class="progress"><span>${done}/${v.total}</span>${meter(done, done, v.total)}</div>
    <div class="scene"><div class="card ${v.flipped ? "flipped" : ""}" id="card" role="button" tabindex="0" aria-label="Virar cartão">
      <div class="face front">${front}<div class="hint">Toca para virar</div></div>
      <div class="face back">${backF}</div>
    </div></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn outline" id="sp" style="flex:1">${SPK} Ouvir</button>
      <button class="btn outline" id="spS" style="flex:1">${SLOW} Devagar</button>
    </div>
    <div class="grades" id="grades" ${v.flipped ? "" : "hidden"}>
      <button class="btn g0" data-g="0">Não sei<small>repete já</small></button>
      <button class="btn g1" data-g="1">Difícil<small>em breve</small></button>
      <button class="btn g2" data-g="2">Sei<small>mais tarde</small></button>
    </div>
    <button class="btn primary" id="show" ${v.flipped ? "hidden" : ""}>Mostrar resposta</button>
  </div>`;
  const card = document.getElementById("card");
  const flip = () => {
    v.flipped = !v.flipped; card.classList.toggle("flipped", v.flipped);
    document.getElementById("grades").hidden = !v.flipped; document.getElementById("show").hidden = v.flipped;
    if (v.flipped && S.settings.auto && item.dir === "pt") speak(c.say);
  };
  card.onclick = flip;
  card.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
  document.getElementById("show").onclick = flip;
  document.getElementById("sp").onclick = () => speak(c.say);
  document.getElementById("spS").onclick = () => speak(c.say, true);
  $app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => answer(+b.dataset.g));
  // swipe after flip: right = Sei, left = Não sei
  let x0 = null;
  card.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  card.addEventListener("touchend", e => {
    if (x0 === null || !v.flipped) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 70) { e.preventDefault(); answer(dx > 0 ? 2 : 0); }
  });
  if (!v.flipped && S.settings.auto && item.dir === "ru") speak(c.say);
}
function answer(g) {
  const v = view; const item = v.queue[v.i];
  if (!(item.id in v.graded)) { v.graded[item.id] = g; v.res[g]++; grade(item.id, g); }
  if (g === 0) v.queue.splice(Math.min(v.i + 4, v.queue.length), 0, { id: item.id, dir: item.dir });
  v.i++; v.flipped = false;
  if (v.i >= v.queue.length) { view = { name: "done", title: v.title, res: v.res, kind: "study" }; }
  render();
}

// ---------- Quiz ----------
function startQuiz(d, mode, push = true) {
  const pool = d.cards;
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(c => {
    const dir = d.alpha ? (Math.random() < .5 ? "ru" : "pt") : pickDir();
    let opts = null;
    if (mode === "mc") opts = shuffle([c, ...shuffle(pool.filter(x => x.id !== c.id)).slice(0, 3)]).map(x => x.id);
    return { id: c.id, dir, opts };
  });
  go({ name: "quiz", deck: d.id, mode, qs, i: 0, right: 0, answered: null }, push);
}
const normPt = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\(.*?\)/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const normRu = s => strip(s).toLowerCase().replace(/ё/g, "е").replace(/[^а-я ]/g, " ").replace(/\s+/g, " ").trim();
const plainTr = html => html.replace(/<[^>]+>/g, "").toLowerCase().replace(/[^a-z]/g, "");
function checkTyped(c, dir, val) {
  if (dir === "ru") return c.pt.split("/").some(alt => normPt(alt) && normPt(alt) === normPt(val));
  const v = normRu(val);
  if (v && v === normRu(c.ru)) return true;
  const t = val.toLowerCase().replace(/[^a-z]/g, "");
  return !!t && t === plainTr(c.trHtml);
}
function renderQuiz() {
  const v = view; const d = deckById(v.deck);
  setHeader(esc(d.title), true);
  const q = v.qs[v.i]; const c = CARDS[q.id];
  const promptHtml = q.dir === "ru"
    ? `<div class="ask">${d.alpha ? "Que som faz esta letra?" : "Como se diz em português?"}</div><div class="q ${c.alpha ? "letter" : ""}" lang="ru">${c.ruHtml}</div>${S.settings.tr && !c.alpha ? `<div class="tr">${c.trHtml}</div>` : ""}`
    : `<div class="ask">${d.alpha ? "Que letra faz este som?" : "Como se diz em russo?"}</div><div class="q">${esc(c.pt)}</div>`;
  const label = x => q.dir === "ru" ? esc(x.pt) : `<span lang="ru">${x.ruHtml}</span>`;
  let body;
  if (v.mode === "mc") {
    body = `<div class="options">${q.opts.map(id => {
      const x = CARDS[id]; let cls = "";
      if (v.answered) { if (id === q.id) cls = "right"; else if (id === v.answered.pick) cls = "wrong"; }
      return `<button class="opt ${cls}" data-o="${esc(id)}" ${v.answered ? "disabled" : ""}>${label(x)}</button>`;
    }).join("")}</div>`;
  } else {
    body = `<form class="typein" id="tf" autocomplete="off">
      <input id="ti" type="text" lang="${q.dir === "ru" ? "pt-PT" : "ru"}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${q.dir === "ru" ? "Escreve em português" : "Escreve em russo (ou em latim)"}" ${v.answered ? "disabled" : ""} value="${v.answered ? esc(v.answered.val) : ""}">
      ${v.answered ? "" : `<button class="btn primary" type="submit">Verificar</button><button class="btn outline" type="button" id="skip">Não sei</button>`}
    </form>`;
  }
  let fb = "";
  if (v.answered) {
    const correct = q.dir === "ru" ? esc(c.pt) : `<span lang="ru">${c.ruHtml}</span> <span class="note">(${c.trHtml.replace(/<\/?b>/g, "")})</span>`;
    fb = `<div class="feedback ${v.answered.ok ? "ok" : "no"}">${v.answered.ok ? "Certo!" : "Resposta certa:"} ${v.answered.ok && v.mode === "mc" ? "" : correct}</div>
      <button class="btn primary" id="next">${v.i + 1 < v.qs.length ? "Seguinte" : "Ver resultado"}</button>`;
  }
  $app.innerHTML = `<div class="view">
    <div class="progress"><span>${v.i + 1}/${v.qs.length}</span>${meter(v.i, v.i, v.qs.length)}<span>${v.right} certas</span></div>
    <div class="prompt">${promptHtml}<button class="iconbtn say" id="sp" aria-label="Ouvir">${SPK}</button></div>
    ${body}${fb}
  </div>`;
  const sp = document.getElementById("sp");
  sp.hidden = q.dir === "pt" && !v.answered;
  sp.onclick = () => speak(c.say);
  const settle = (ok, extra) => {
    v.answered = { ok, ...extra }; if (ok) v.right++;
    grade(q.id, ok ? 2 : 0);
    if (q.dir === "ru" || S.settings.auto) speak(c.say);
    render();
    const n = document.getElementById("next"); n && n.focus();
  };
  if (v.mode === "mc" && !v.answered) $app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => settle(b.dataset.o === q.id, { pick: b.dataset.o }));
  if (v.mode === "type" && !v.answered) {
    const ti = document.getElementById("ti"); setTimeout(() => ti.focus(), 50);
    document.getElementById("tf").onsubmit = e => { e.preventDefault(); if (!ti.value.trim()) return; settle(checkTyped(c, q.dir, ti.value), { val: ti.value }); };
    document.getElementById("skip").onclick = () => settle(false, { val: "" });
  }
  const n = document.getElementById("next");
  if (n) n.onclick = () => {
    v.i++; v.answered = null;
    if (v.i >= v.qs.length) view = { name: "done", title: d.title, kind: "quiz", right: v.right, total: v.qs.length, deck: d.id, mode: v.mode };
    render();
  };
}

// ---------- Done ----------
function renderDone() {
  const v = view;
  setHeader(esc(v.title), true);
  let inner;
  if (v.kind === "study") {
    const [a, b, c] = v.res;
    inner = `<h2>${c >= a + b ? "Молодец!" : "Хорошо!"}</h2><p class="note">${c >= a + b ? "Muito bem! Estás a avançar depressa." : "Bom trabalho. As palavras difíceis voltam em breve."}</p>
      <div class="nums"><div class="g2"><b>${c}</b>sei</div><div class="g1"><b>${b}</b>difícil</div><div class="g0"><b>${a}</b>não sei</div></div>`;
  } else {
    const pct = Math.round(v.right / v.total * 100);
    inner = `<h2>${v.right}/${v.total}</h2><p class="note">${pct >= 80 ? "Отлично! Excelente." : pct >= 50 ? "Nada mal. Continua a praticar." : "Ainda a aprender. Experimenta estudar os cartões primeiro."}</p>`;
  }
  $app.innerHTML = `<div class="view"><div class="result">${inner}
    ${v.kind === "quiz" ? `<button class="btn ghost" id="again">Outro quiz</button>` : ""}
    <button class="btn primary" id="home">Voltar ao início</button></div></div>`;
  document.getElementById("home").onclick = () => { navStack = []; view = { name: "home" }; render(); };
  const ag = document.getElementById("again"); if (ag) ag.onclick = () => startQuiz(deckById(v.deck), v.mode, false);
}

// ---------- Settings ----------
let confirmReset = false;
function renderSettings() {
  setHeader("Definições", true);
  const s = S.settings;
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([val, lab]) => `<button data-k="${key}" data-v="${val}" aria-pressed="${String(s[key]) === String(val)}">${lab}</button>`).join("")}</div>`;
  const voiceNote = "Todas as palavras têm áudio gravado por uma voz russa. Se não ouvires nada, confirma que o iPhone não está em silêncio (interruptor lateral) e que o volume está alto.";
  $app.innerHTML = `<div class="view settings">
    <div class="row"><div class="lbl">Direção dos cartões</div>${seg("dir", [["ru", "Russo → PT"], ["pt", "PT → Russo"], ["mix", "Misto"]])}</div>
    <div class="row"><div class="lbl">Palavras novas por dia</div>${seg("newPer", [[5, "5"], [10, "10"], [20, "20"], [40, "40"]])}</div>
    <div class="row"><label class="switch"><span class="lbl">Mostrar transliteração</span><input type="checkbox" id="optTr" ${s.tr ? "checked" : ""}></label>
      <div class="desc">Escrita à portuguesa: "ch" como em chave, "j" como em já, sílaba tónica a negrito.</div></div>
    <div class="row"><label class="switch"><span class="lbl">Ler em voz alta automaticamente</span><input type="checkbox" id="optAuto" ${s.auto ? "checked" : ""}></label>
      <div class="desc">${voiceNote}</div>
      <button class="btn outline" id="testV">${SPK} Testar: Здравствуйте!</button></div>
    <div class="row"><div class="lbl">Progresso</div>
      <div class="desc" style="margin-top:0">${syncState === "cloud" ? "Guardado na tua conta Claude e neste dispositivo." : "Guardado neste dispositivo."} ${Object.keys(S.cards).length} palavras vistas.</div>
      ${confirmReset ? `<div class="desc danger" style="margin-top:0">Apagar todo o progresso? Não dá para desfazer.</div>
        <div class="actions"><button class="btn outline" id="rNo">Cancelar</button><button class="btn g0" id="rYes">Apagar</button></div>`
        : `<button class="btn outline danger" id="reset">Recomeçar do zero</button>`}
    </div>
  </div>`;
  $app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k; s[k] = k === "newPer" ? +b.dataset.v : b.dataset.v; save(); render(); });
  document.getElementById("optTr").onchange = e => { s.tr = e.target.checked; save(); };
  document.getElementById("optAuto").onchange = e => { s.auto = e.target.checked; save(); };
  document.getElementById("testV").onclick = () => speak(CARDS["travel:здравствуйте"].say);
  const r = document.getElementById("reset"); if (r) r.onclick = () => { confirmReset = true; render(); };
  const rn = document.getElementById("rNo"); if (rn) rn.onclick = () => { confirmReset = false; render(); };
  const ry = document.getElementById("rYes"); if (ry) ry.onclick = () => { confirmReset = false; const keep = S.settings; S = defaults(); S.settings = keep; save(); toast("Progresso apagado."); render(); };
}

render();
connectCloud();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
